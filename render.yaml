services:
  - type: web
    name: dhako-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dhako-db
          property: connectionString
      - key: JWT_SECRET
        value: replace-with-secure-key-in-production
      - key: FRONTEND_URL
        value: https://dhako-frontend.onrender.com
      - key: PORT
        value: 10000

  - type: static
    name: dhako-frontend
    buildCommand: pnpm install && pnpm build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://dhako-backend.onrender.com

databases:
  - name: dhako-db
    databaseName: dhako
    user: dhako_user
    plan: free
    version: "15"
