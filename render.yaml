services:
  - type: web
    name: dhako-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dhako-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://dhako-frontend.onrender.com
      - key: PORT
        value: 10000

  - type: web
    name: dhako-frontend
    env: static
    plan: free
    buildCommand: VITE_API_URL=https://dhako-backend.onrender.com pnpm install && pnpm build
    staticPublishPath: ./dist

databases:
  - name: dhako-db
    databaseName: dhako
    user: dhako_user
    plan: free