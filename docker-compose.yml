services:
  db:
    image: postgres:16-alpine
    container_name: dhako-postgres
    environment:
      POSTGRES_USER: dhako_user
      POSTGRES_PASSWORD: dhako_password
      POSTGRES_DB: dhako
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/models/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dhako_user -d dhako"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    container_name: dhako-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgres://dhako_user:dhako_password@db:5432/dhako
      JWT_SECRET: your-secret-key-change-in-production
      FRONTEND_URL: http://localhost:3001
    ports:
      - "3001:3001"
    restart: unless-stopped

volumes:
  postgres_data:

